services:
  lidarr-hits-bot:
    build: .
    container_name: lidarr-hits-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN
      - COMMAND_PREFIX
      - REPORT_CHANNEL_ID
      - POPULARITY_THRESHOLD
      - LASTFM_API_KEY
      - LIDARR_URL
      - LIDARR_API_KEY
      - LIDARR_QUALITY_PROFILE
      - DOWNLOAD_MODE
      - DAILY_CHECK_CRON
      - TIMEZONE
    volumes:
      # Persist the SQLite database
      - bot-data:/data
    # If Lidarr is also in Docker, use the Docker network name:
    #   LIDARR_URL=http://lidarr:8686
    # If Lidarr is on the host:
    #   LIDARR_URL=http://host.docker.internal:8686
    # Or use the host IP directly.

volumes:
  bot-data:
