[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidarr-hits-bot"
version = "1.0.0"
description = "Discord bot that tracks artists and only downloads popular songs via Lidarr"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "discord-py>=2.3,<3",
    "requests>=2.31,<3",
    "croniter>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
